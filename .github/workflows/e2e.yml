name: E2E against API

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Repositorio de la API; se puede sobrescribir con la variable de repositorio API_REPOSITORY.
  API_REPOSITORY: ${{ vars.API_REPOSITORY || 'hugo-inda-toledo/walmart-cl-slot-reservation-api' }}

jobs:
  e2e:
    name: Playwright and full-stack smoke
    runs-on: ubuntu-latest
    steps:
      - name: Validate API repository configuration
        shell: bash
        run: |
          if [[ -z "$API_REPOSITORY" ]]; then
            echo "Configura la variable de repositorio API_REPOSITORY (owner/repo) y, si es privado, el secreto API_REPO_TOKEN." >&2
            exit 1
          fi
      - name: Checkout web repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: web
          submodules: false
      - name: Checkout API repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.API_REPOSITORY }}
          ref: ${{ vars.API_REF || 'main' }}
          token: ${{ secrets.API_REPO_TOKEN || github.token }}
          path: api
          submodules: false
      - name: Start API stack
        working-directory: api
        run: docker compose up --build -d --wait
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright suite against API
        working-directory: web
        env:
          E2E_API_URL: http://localhost:8080
        run: npm run e2e
      - name: Start web stack
        working-directory: web
        run: docker compose up --build -d --wait
      - name: Run full-stack smoke checks
        working-directory: web
        run: ./scripts/smoke-fullstack.sh
      - name: Collect API and web logs
        if: failure()
        shell: bash
        run: |
          (cd api && docker compose logs --no-color) > api-compose.log || true
          (cd web && docker compose logs --no-color) > web-compose.log || true
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-e2e-diagnostics
          path: |
            web/playwright-report/
            web/test-results/
            api-compose.log
            web-compose.log
          if-no-files-found: warn
      - name: Remove web stack and volumes
        if: always()
        working-directory: web
        run: docker compose down -v || true
      - name: Remove API stack and volumes
        if: always()
        working-directory: api
        run: docker compose down -v || true
